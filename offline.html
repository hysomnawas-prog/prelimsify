<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/no-inspect.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prelimsify — offline</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,sans-serif;color:#1d1d1f;
       display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;margin:0;padding:24px;
       background:
         radial-gradient(1100px 700px at 8% -10%, rgba(94,92,230,.35), transparent 60%),
         radial-gradient(900px 700px at 100% 0%, rgba(10,132,255,.30), transparent 55%),
         radial-gradient(1000px 800px at 50% 110%, rgba(255,55,95,.22), transparent 55%),
         linear-gradient(160deg,#eef1fb 0%, #f6eef7 45%, #eef6f4 100%);
       background-attachment:fixed;}
  .box{max-width:360px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
       border:1px solid rgba(255,255,255,.35);border-radius:24px;padding:32px 28px;box-shadow:0 20px 60px rgba(31,38,90,.18);}
  h1{font-size:22px;margin-bottom:8px;}
  p{color:#6e6e73;margin-bottom:20px;}
  button{background:linear-gradient(135deg,#2b2b30,#000);color:#fff;border:none;padding:12px 24px;border-radius:999px;font-size:15px;cursor:pointer;
         transition:transform .32s cubic-bezier(.25,1,.5,1);}
  button:hover{transform:scale(1.05) translateY(-2px);}
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>Prelimsify needs an internet connection to load your tests, saved projects, and scores.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
